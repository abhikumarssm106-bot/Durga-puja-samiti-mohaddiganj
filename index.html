<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#570011" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="मोहद्दीगंज दुर्गा पूजा समिति - सासाराम, बिहार। भक्ति और उल्लास में एकजुट। नवरात्रि 2026 के लिए पूजा कार्यक्रम, गैलरी और संपर्क जानकारी।" />
    <title>मोहद्दीगंज दुर्गा पूजा समिति - सासाराम, बिहार</title>
    
    <!-- Preconnect to font servers ASAP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Critical fonts: Only load essential weights first, use display=swap -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet" />
    
    <!-- Defer non-critical fonts (Playfair Display extra weights, Material Symbols) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" /></noscript>
    
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" /></noscript>

    <!-- Inline critical CSS for loading screen — renders instantly before any JS/CSS loads -->
    <style>
      /* Loading screen styles */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      #app-loader .loader-icon {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(242, 201, 76, 0.15);
        border-top-color: #F2C94C;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #app-loader .loader-text {
        font-family: 'Noto Serif Devanagari', serif;
        color: #F2C94C;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
        opacity: 0;
        animation: fadeTextIn 0.6s 0.3s ease-out forwards;
      }
      #app-loader .loader-sub {
        font-family: sans-serif;
        color: rgba(255,255,255,0.5);
        font-size: 12px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0;
        animation: fadeTextIn 0.6s 0.6s ease-out forwards;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes fadeTextIn {
        to { opacity: 1; }
      }
      /* Hide content flash — content hidden until app is ready */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      #root.app-ready {
        opacity: 1;
      }
    </style>
  </head>
  <body class="bg-surface font-body-md text-on-surface antialiased">
    <!-- Professional loading screen — shows instantly before React loads -->
    <div id="app-loader">
      <div class="loader-icon"></div>
      <div class="loader-text">दुर्गा पूजा समिति</div>
      <div class="loader-sub">मोहद्दीगंज · सासाराम</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
